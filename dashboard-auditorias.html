<style>
/* =========================================================
   ESTILOS ORIGINALES / BASE
   ========================================================= */

:root{
  --brand:#CF002E;
  --brand-dark:#A00023;
  --brand-deep:#6E0018;
  --accent:#FDD000;
  --accent-dark:#E6BC00;

  --ink:#1A1A1A;
  --ink-soft:#4A4A4A;
  --ink-muted:#8A8A8A;

  --line:#E5E5E5;
  --line-soft:#F2F2F2;
  --bg:#F7F7F7;
  --surface:#FFFFFF;

  --ok:#1B8A3A;

  --radius-sm:7px;
  --radius-md:11px;
  --radius-lg:16px;

  --shadow-1:0 2px 7px rgba(0,0,0,.08);
  --shadow-2:0 5px 16px rgba(0,0,0,.10);
  --shadow-3:0 10px 28px rgba(0,0,0,.13);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

/* =========================================================
   HEADER / NAVEGACIÓN
   ========================================================= */

.qa-unified-header{
  position:sticky;
  top:0;
  z-index:1000;

  min-height:68px;
  padding:11px 24px;

  display:flex;
  align-items:center;
  gap:14px;

  background:
    linear-gradient(
      90deg,
      var(--brand-deep) 0%,
      var(--brand) 55%,
      #D90032 100%
    );

  box-shadow:0 4px 12px rgba(0,0,0,.12);

  color:#fff;
}

.qa-unified-header .logo{
  width:42px;
  height:42px;

  flex:0 0 42px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--accent);
  color:var(--brand-deep);

  border-radius:9px;

  font-size:16px;
  font-weight:900;
}

.qa-unified-header .titles{
  min-width:180px;
  display:flex;
  flex-direction:column;
  line-height:1.05;
}

.qa-unified-header .t1{
  font-size:10px;
  letter-spacing:1.2px;
  text-transform:uppercase;
  font-weight:700;
  opacity:.9;
}

.qa-unified-header .t2{
  margin-top:3px;
  font-size:18px;
  font-weight:800;
}

.qa-unified-nav{
  display:flex;
  align-items:center;
  gap:6px;
  margin-left:auto;
}

.qa-unified-nav a{
  min-height:34px;
  padding:0 10px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  color:#fff;
  background:rgba(255,255,255,.13);

  text-decoration:none;

  font-size:10px;
  font-weight:800;

  transition:.15s ease;
}

.qa-unified-nav a:hover{
  background:rgba(255,255,255,.23);
}

.qa-unified-nav a.active{
  background:var(--accent);
  color:var(--brand-deep);
}

.qa-unified-header .badge{
  height:34px;
  padding:0 10px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:rgba(253,208,0,.15);
  border:1px solid rgba(253,208,0,.45);

  color:#fff;
  font-size:10px;
  font-weight:800;
}

.qa-header-update{
  min-width:125px;
  min-height:34px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:3px 8px;

  border-radius:8px;

  background:rgba(255,255,255,.10);
}

.qa-header-update .update-label{
  font-size:7px;
  line-height:1;
  text-transform:uppercase;
  opacity:.75;
}

.qa-header-update .update-value{
  margin-top:3px;
  font-size:9px;
  line-height:1;
  font-weight:700;
}

.qa-home{
  min-height:34px;
  padding:0 11px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:#fff;
  color:var(--brand-deep);

  text-decoration:none;

  font-size:10px;
  font-weight:900;

  transition:.15s ease;
}

.qa-home:hover{
  background:#fffbe0;
}

/* Ocultar header antiguo cuando existe el nuevo shell */
body:has(.qa-unified-header) .header{
  display:none !important;
}

/* =========================================================
   CONTENEDOR
   ========================================================= */

.container,
.wrap{
  width:100%;
  max-width:1800px;
  margin:0 auto;
  padding:22px 24px 36px;
}

/* =========================================================
   FILTROS
   ========================================================= */

.filters-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1);

  padding:16px;
  margin-bottom:18px;
}

.filters-grid{
  display:grid;
  grid-template-columns:
    minmax(170px,1.3fr)
    minmax(130px,1fr)
    minmax(130px,1fr)
    minmax(170px,1.3fr)
    minmax(150px,1fr)
    auto;

  gap:12px;
  align-items:end;
}

.field{
  min-width:0;
  position:relative;
}

.field label{
  display:block;
  margin-bottom:6px;

  color:var(--ink-soft);

  font-size:11px;
  font-weight:800;
}

.field input,
.field select{
  width:100%;
  height:38px;

  padding:0 10px;

  border:1px solid var(--line);
  border-radius:8px;

  background:#fff;
  color:var(--ink);

  outline:none;

  font-size:12px;
}

.field input:focus,
.field select:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 2px rgba(207,0,46,.08);
}

.filter-actions{
  display:flex;
  gap:7px;
}

.btn{
  min-height:38px;
  padding:0 14px;

  border:0;
  border-radius:8px;

  cursor:pointer;

  font-size:11px;
  font-weight:900;
}

.btn-primary{
  background:var(--brand);
  color:#fff;
}

.btn-primary:hover{
  background:var(--brand-dark);
}

.btn-secondary{
  background:#eee;
  color:var(--ink-soft);
}

.btn-secondary:hover{
  background:#e2e2e2;
}

/* =========================================================
   AUTOCOMPLETE
   ========================================================= */

.autocomplete{
  position:relative;
}

.suggestions{
  position:absolute;
  top:100%;
  left:0;
  right:0;

  z-index:100;

  display:none;

  max-height:220px;
  overflow:auto;

  background:#fff;

  border:1px solid var(--line);
  border-top:0;

  border-radius:0 0 8px 8px;

  box-shadow:var(--shadow-2);
}

.suggestions.open{
  display:block;
}

.suggestion{
  padding:9px 10px;

  cursor:pointer;

  font-size:11px;
}

.suggestion:hover{
  background:var(--line-soft);
}

/* =========================================================
   GRÁFICOS
   ========================================================= */

.charts-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.chart-card{
  min-width:0;

  background:var(--surface);

  border:1px solid var(--line);
  border-radius:var(--radius-lg);

  box-shadow:var(--shadow-1);

  padding:16px;
}

.chart-title{
  margin-bottom:12px;

  color:var(--ink);

  font-size:13px;
  font-weight:900;
}

.chart-body{
  position:relative;
  width:100%;
  height:330px;
}

.status{
  margin-top:12px;

  color:var(--ink-muted);

  font-size:10px;
  text-align:right;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:1100px){

  .qa-unified-header .titles .t2{
    font-size:15px;
  }

  .qa-unified-header .badge,
  .qa-header-update{
    display:none;
  }

  .filters-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .filter-actions{
    grid-column:1/-1;
    justify-content:flex-end;
  }
}

@media(max-width:760px){

  .qa-unified-header{
    min-height:64px;
    padding:9px 12px;
    gap:9px;
  }

  .qa-unified-header .logo{
    width:38px;
    height:38px;
    flex-basis:38px;
  }

  .qa-unified-header .titles .t1{
    font-size:8px;
  }

  .qa-unified-header .titles .t2{
    font-size:13px;
  }

  .qa-unified-nav{
    display:none;
  }

  .qa-home{
    margin-left:auto;
  }

  .wrap,
  .container{
    padding:14px 12px 28px;
  }

  .filters-grid{
    grid-template-columns:1fr;
  }

  .filter-actions{
    grid-column:auto;
  }

  .filter-actions .btn{
    flex:1;
  }

  .charts-grid{
    grid-template-columns:1fr;
  }

  .chart-body{
    height:290px;
  }
}
</style>

<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  'https://wpitemofrqzjcsetmmim.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_lHlAJ8Q2lThBAd9oDy69cw_QkSTlJLu';

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   VARIABLES
   ========================================================= */

let datos = [];

let charts = {};


/* =========================================================
   HELPERS
   ========================================================= */

const $ = id =>
  document.getElementById(id);


const clean = value =>
  String(value ?? '').trim();


const norm = value =>
  clean(value).toLowerCase();


/* =========================================================
   FECHAS
   ========================================================= */

function fecha(value){

  if(!value){
    return null;
  }

  const d =
    new Date(value);

  return isNaN(d)
    ? null
    : d;
}


function mes(value){

  const d =
    fecha(value);

  if(!d){
    return 'Sin fecha';
  }

  return (
    d.getFullYear() +
    '-' +
    String(
      d.getMonth()+1
    ).padStart(2,'0')
  );
}


function mesLabel(key){

  if(
    key === 'Sin fecha'
  ){
    return key;
  }

  const [
    year,
    month
  ] =
    key.split('-');

  const d =
    new Date(
      Number(year),
      Number(month)-1,
      1
    );

  return d.toLocaleDateString(
    'es-MX',
    {
      month:'short',
      year:'numeric'
    }
  );
}


/* =========================================================
   ORIGEN
   ========================================================= */

/*
   Si existe un campo "origen" se utiliza.
   Si no existe, se utiliza "area" como origen disponible
   dentro de Auditoria_Recibo.
*/

function origen(row){

  return (
    clean(row.origen) ||
    clean(row.area) ||
    'Sin origen'
  );

}


/* =========================================================
   VALORES ÚNICOS
   ========================================================= */

function unique(
  rows,
  field
){

  return [
    ...new Set(
      rows
        .map(
          row =>
            clean(row[field])
        )
        .filter(Boolean)
    )
  ].sort(
    (a,b) =>
      a.localeCompare(
        b,
        'es',
        {
          sensitivity:'base'
        }
      )
  );

}


/* =========================================================
   CONTADORES
   ========================================================= */

function contar(
  rows,
  fn
){

  const map = {};

  rows.forEach(
    row => {

      const key =
        fn(row);

      map[key] =
        (map[key] || 0) + 1;

    }
  );

  return Object
    .entries(map)
    .sort(
      (a,b) =>
        b[1] - a[1]
    );

}


/* =========================================================
   DESTRUIR GRÁFICOS
   ========================================================= */

function destroy(){

  Object
    .values(charts)
    .forEach(
      chart => {

        try{
          chart.destroy();
        }
        catch(e){}

      }
    );

  charts = {};

}


/* =========================================================
   OPCIONES BASE CHART.JS
   ========================================================= */

function base(
  horizontal = false
){

  return {

    responsive:true,

    maintainAspectRatio:false,

    indexAxis:
      horizontal
        ? 'y'
        : 'x',

    plugins:{

      legend:{
        display:false
      },

      tooltip:{
        enabled:true
      }

    },

    scales:{

      x:{
        beginAtZero:true,
        ticks:{
          precision:0
        }
      },

      y:{
        beginAtZero:true,
        ticks:{
          precision:0
        }
      }

    }

  };

}


/* =========================================================
   GRÁFICO DE BARRAS
   ========================================================= */

function bar(
  id,
  labels,
  values,
  horizontal = false
){

  return new Chart(
    $(id),
    {

      type:'bar',

      data:{

        labels,

        datasets:[{

          data:values,

          borderWidth:1,

          borderRadius:5

        }]

      },

      options:
        base(horizontal)

    }
  );

}


/* =========================================================
   GRÁFICO DE LÍNEA
   ========================================================= */

function line(
  id,
  labels,
  values
){

  return new Chart(
    $(id),
    {

      type:'line',

      data:{

        labels,

        datasets:[{

          data:values,

          tension:.25,

          fill:false,

          borderWidth:2,

          pointRadius:3

        }]

      },

      options:
        base()

    }
  );

}


/* =========================================================
   FILTRAR DATOS
   ========================================================= */

function filtrar(){

  const persona =
    norm(
      $('fPersona').value
    );

  const hallazgo =
    norm(
      $('fHallazgo').value
    );

  const area =
    norm(
      $('fArea').value
    );


  const inicio =
    $('fInicio').value
      ? new Date(
          $('fInicio').value +
          'T00:00:00'
        )
      : null;


  const fin =
    $('fFin').value
      ? new Date(
          $('fFin').value +
          'T23:59:59'
        )
      : null;


  return datos.filter(
    row => {

      const d =
        fecha(row.fecha);


      if(
        persona &&
        !norm(row.nombre)
          .includes(persona)
      ){
        return false;
      }


      if(
        hallazgo &&
        !norm(row.hallazgo)
          .includes(hallazgo)
      ){
        return false;
      }


      if(
        area &&
        norm(row.area) !== area
      ){
        return false;
      }


      if(
        inicio &&
        (
          !d ||
          d < inicio
        )
      ){
        return false;
      }


      if(
        fin &&
        (
          !d ||
          d > fin
        )
      ){
        return false;
      }


      return true;

    }
  );

}


/* =========================================================
   ACTUALIZAR GRÁFICOS
   ========================================================= */

function actualizar(){

  const rows =
    filtrar();


  destroy();


  /* -------------------------------------------------------
     DESVIACIONES POR HALLAZGO
     ------------------------------------------------------- */

  let x =
    contar(
      rows,
      row =>
        clean(
          row.hallazgo
        ) ||
        'Sin hallazgo'
    );


  charts.hallazgo =
    bar(
      'chartHallazgo',

      x.map(
        value =>
          value[0]
      ),

      x.map(
        value =>
          value[1]
      ),

      x.length >= 6
    );


  /* -------------------------------------------------------
     DESVIACIONES POR ORIGEN
     ------------------------------------------------------- */

  x =
    contar(
      rows,
      origen
    );


  charts.origen =
    bar(
      'chartOrigen',

      x.map(
        value =>
          value[0]
      ),

      x.map(
        value =>
          value[1]
      ),

      x.length >= 6
    );


  /* -------------------------------------------------------
     DESVIACIONES POR MES
     ------------------------------------------------------- */

  x =
    contar(
      rows,
      row =>
        mes(row.fecha)
    );


  x.sort(
    (a,b) =>
      a[0].localeCompare(
        b[0]
      )
  );


  charts.mes =
    line(
      'chartMes',

      x.map(
        value =>
          mesLabel(
            value[0]
          )
      ),

      x.map(
        value =>
          value[1]
      )
    );


  /* -------------------------------------------------------
     AUDITORÍAS POR PERSONA
     ------------------------------------------------------- */

  x =
    contar(
      rows,
      row =>
        clean(
          row.nombre
        ) ||
        'Sin persona'
    );


  charts.persona =
    bar(
      'chartPersona',

      x.map(
        value =>
          value[0]
      ),

      x.map(
        value =>
          value[1]
      ),

      x.length >= 6
    );


  /* -------------------------------------------------------
     ESTADO
     ------------------------------------------------------- */

  $('estado').textContent =
    `${rows.length.toLocaleString('es-MX')} registros mostrados`;

}


/* =========================================================
   CARGAR OPCIONES DE FILTROS
   ========================================================= */

function filtros(){

  const personas =
    unique(
      datos,
      'nombre'
    );


  const hallazgos =
    unique(
      datos,
      'hallazgo'
    );


  const areas =
    unique(
      datos,
      'area'
    );


  /* Área */

  $('fArea').innerHTML =
    '<option value="">Todas las áreas</option>' +

    areas
      .map(
        value =>
          `<option value="${value.replace(/"/g,'&quot;')}">${value}</option>`
      )
      .join('');


  /* Personas */

  $('sPersona').innerHTML =
    personas
      .map(
        value =>
          `<div class="suggestion" data-value="${value.replace(/"/g,'&quot;')}">${value}</div>`
      )
      .join('');


  /* Hallazgos */

  $('sHallazgo').innerHTML =
    hallazgos
      .map(
        value =>
          `<div class="suggestion" data-value="${value.replace(/"/g,'&quot;')}">${value}</div>`
      )
      .join('');

}


/* =========================================================
   SUGERENCIAS
   ========================================================= */

function sugerencias(
  inputId,
  listId
){

  const input =
    $(inputId);

  const list =
    $(listId);


  input.addEventListener(
    'input',
    () => {

      const q =
        norm(
          input.value
        );


      [
        ...list.children
      ]
      .forEach(
        element => {

          element.style.display =
            (
              !q ||
              norm(
                element.dataset.value
              ).includes(q)
            )
              ? ''
              : 'none';

        }
      );


      list.classList.add(
        'open'
      );


      actualizar();

    }
  );


  input.addEventListener(
    'focus',
    () => {

      list.classList.add(
        'open'
      );

    }
  );


  list.addEventListener(
    'click',
    event => {

      const item =
        event.target.closest(
          '.suggestion'
        );


      if(!item){
        return;
      }


      input.value =
        item.dataset.value;


      list.classList.remove(
        'open'
      );


      actualizar();

    }
  );


  document.addEventListener(
    'click',
    event => {

      if(
        !input.parentElement
          .contains(event.target)
      ){

        list.classList.remove(
          'open'
        );

      }

    }
  );

}


/* =========================================================
   CARGAR DATOS DESDE SUPABASE
   ========================================================= */

async function cargar(){

  $('estado').textContent =
    'Cargando datos...';


  try{

    let all = [];

    let from = 0;


    while(true){

      const {
        data,
        error
      } =
        await sb
          .from(
            'Auditoria_Recibo'
          )
          .select('*')
          .range(
            from,
            from + 999
          );


      if(error){
        throw error;
      }


      if(
        !data ||
        !data.length
      ){
        break;
      }


      all.push(
        ...data
      );


      if(
        data.length < 1000
      ){
        break;
      }


      from += 1000;

    }


    datos =
      all;


    filtros();

    actualizar();

  }
  catch(error){

    console.error(
      error
    );


    $('estado').textContent =
      'No fue posible cargar los datos de Auditoria_Recibo.';

  }

}


/* =========================================================
   BOTÓN APLICAR
   ========================================================= */

$('btnAplicar')
  .addEventListener(
    'click',
    actualizar
  );


/* =========================================================
   BOTÓN LIMPIAR
   ========================================================= */

$('btnLimpiar')
  .addEventListener(
    'click',
    () => {

      [
        'fPersona',
        'fInicio',
        'fFin',
        'fHallazgo'
      ]
      .forEach(
        id =>
          $(id).value = ''
      );


      $('fArea').value =
        '';


      actualizar();

    }
  );


/* =========================================================
   CAMBIOS AUTOMÁTICOS
   ========================================================= */

[
  'fInicio',
  'fFin',
  'fArea'
]
.forEach(
  id =>
    $(id).addEventListener(
      'change',
      actualizar
    )
);


/* =========================================================
   INICIALIZAR AUTOCOMPLETE
   ========================================================= */

sugerencias(
  'fPersona',
  'sPersona'
);


sugerencias(
  'fHallazgo',
  'sHallazgo'
);


/* =========================================================
   INICIAR DASHBOARD
   ========================================================= */

cargar();

</script>
